    <!-- Structured data. There was none anywhere on this site before
         12 September 2026, which was the largest gap for answer engines and
         for any model deciding whether it can cite this product.

         It asserts only what the page actually contains. No aggregateRating:
         Decide One has never asked anyone for a review, and inventing one
         would be both structured-data spam and a lie. The price is 0 because
         VISION.md §11.1 says the price is free — no tier, no licence, nothing
         held back — and QC Rule 24 fails the build if that stops being true. -->
